<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최종 성찰 노트 (Final Reflection Sheet)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f3ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.5);
        }

        /* Auto-resizing textarea animation smoothness */
        textarea {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Print styles */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .card-box {
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
                page-break-inside: avoid;
            }
            textarea {
                border: none !important;
                resize: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200 min-h-full flex flex-col">

    <!-- Top Progress Bar -->
    <div class="fixed top-0 left-0 w-full h-1 bg-slate-200 dark:bg-slate-800 z-50 no-print">
        <div id="progressBar" class="h-full bg-indigo-600 transition-all duration-300 w-0"></div>
    </div>

    <!-- Main Navigation Header -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 no-print">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none text-slate-900 dark:text-white">최종 성찰 일지</h1>
                    <span id="saveStatus" class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1 mt-0.5">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-[10px]"></i> 자동 저장됨
                    </span>
                </div>
            </div>

            <!-- Global Action Tools -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Read/Edit Mode Toggle -->
                <button id="viewModeBtn" onclick="toggleViewMode()" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-eye"></i>
                    <span class="hidden sm:inline">미리보기</span>
                </button>

                <!-- Theme Toggle -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs sm:text-sm transition" title="다크/라이트 모드">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>

                <!-- Export Menu Dropdown -->
                <div class="relative inline-block text-left">
                    <button id="exportDropdownBtn" onclick="toggleExportMenu()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs sm:text-sm font-medium shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-download"></i>
                        <span>내보내기</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-0.5"></i>
                    </button>
                    <div id="exportMenu" class="hidden absolute right-0 mt-2 w-48 rounded-xl bg-white dark:bg-slate-800 shadow-xl border border-slate-200 dark:border-slate-700 py-1.5 z-50">
                        <button onclick="exportToPDF()" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-700/50 flex items-center gap-2">
                            <i class="fa-solid fa-file-pdf text-red-500"></i> PDF 저장 / 인쇄
                        </button>
                        <button onclick="exportToMarkdown()" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-700/50 flex items-center gap-2">
                            <i class="fa-brands fa-markdown text-blue-500"></i> 마크다운 (.md) 저장
                        </button>
                        <button onclick="exportToJSON()" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-700/50 flex items-center gap-2">
                            <i class="fa-solid fa-code text-amber-500"></i> 백업 데이터 (.json)
                        </button>
                        <hr class="my-1 border-slate-100 dark:border-slate-700">
                        <label class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-indigo-50 dark:hover:bg-slate-700/50 flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-upload text-emerald-500"></i> 백업 불러오기
                            <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importFromJSON(event)">
                        </label>
                    </div>
                </div>

                <!-- Reset Button -->
                <button onclick="confirmReset()" class="p-2 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 transition text-xs sm:text-sm" title="초기화">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">

        <!-- Template Selector Banner -->
        <div id="templateBanner" class="no-print mb-8 bg-gradient-to-r from-indigo-500/10 via-purple-500/10 to-pink-500/10 border border-indigo-100 dark:border-slate-800 rounded-2xl p-5 shadow-sm">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h2 class="text-base font-semibold text-slate-900 dark:text-white flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i>
                        성찰 템플릿 선택
                    </h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">목적에 어울리는 작성 프레임워크를 선택해 보세요.</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="applyTemplate('comprehensive')" class="tmpl-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 transition shadow-sm">
                        📋 종합 성찰
                    </button>
                    <button onclick="applyTemplate('kpt')" class="tmpl-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 transition shadow-sm">
                        💡 KPT (Keep/Problem/Try)
                    </button>
                    <button onclick="applyTemplate('4f')" class="tmpl-btn px-3 py-1.5 text-xs font-medium rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 dark:hover:border-indigo-400 transition shadow-sm">
                        🎯 4F (Facts/Feelings/Findings/Future)
                    </button>
                </div>
            </div>
        </div>

        <!-- Document Root Card -->
        <div id="printableArea" class="bg-white dark:bg-slate-800/80 rounded-2xl border border-slate-200 dark:border-slate-700/80 shadow-xl shadow-slate-200/50 dark:shadow-none p-6 sm:p-10 transition-all">

            <!-- Title & Metadata Section -->
            <div class="border-b border-slate-200 dark:border-slate-700/80 pb-6 mb-8">
                <input id="docTitle" type="text" value="2026 최종 프로젝트 및 성찰 보고서" 
                    placeholder="성찰 제목을 입력하세요..." 
                    class="w-full text-2xl sm:text-3xl font-bold bg-transparent border-b-2 border-transparent hover:border-slate-200 focus:border-indigo-500 focus:outline-none transition py-1 text-slate-900 dark:text-white"
                    oninput="handleInput()">

                <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
                    <div class="flex items-center gap-2 text-slate-600 dark:text-slate-300">
                        <i class="fa-regular fa-user text-slate-400 w-4 text-center"></i>
                        <span class="text-xs text-slate-400 font-medium">작성자:</span>
                        <input id="docAuthor" type="text" value="홍길동" placeholder="이름" 
                            class="bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-indigo-500 focus:outline-none text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 w-full py-0.5"
                            oninput="handleInput()">
                    </div>
                    <div class="flex items-center gap-2 text-slate-600 dark:text-slate-300">
                        <i class="fa-regular fa-calendar text-slate-400 w-4 text-center"></i>
                        <span class="text-xs text-slate-400 font-medium">일자:</span>
                        <input id="docDate" type="date" value="" 
                            class="bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-indigo-500 focus:outline-none text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 w-full py-0.5"
                            onchange="handleInput()">
                    </div>
                    <div class="flex items-center gap-2 text-slate-600 dark:text-slate-300">
                        <i class="fa-solid fa-tag text-slate-400 w-4 text-center"></i>
                        <span class="text-xs text-slate-400 font-medium">카테고리:</span>
                        <input id="docCategory" type="text" value="프로젝트 마무리 / 성장 일지" placeholder="카테고리" 
                            class="bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-indigo-500 focus:outline-none text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 w-full py-0.5"
                            oninput="handleInput()">
                    </div>
                </div>

                <!-- Tags Input Block -->
                <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center gap-2">
                    <i class="fa-solid fa-hashtag text-xs text-slate-400"></i>
                    <span class="text-xs text-slate-400 font-medium">태그:</span>
                    <input id="docTags" type="text" value="성장, 회고, 역량강화" placeholder="태그 (쉼표 구분)" 
                        class="text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1 w-full sm:w-64 focus:outline-none focus:border-indigo-500"
                        oninput="handleInput()">
                </div>
            </div>

            <!-- Dynamic Reflection Sections Container -->
            <div id="sectionsContainer" class="space-y-8">
                <!-- Sections dynamically rendered via JavaScript -->
            </div>

            <!-- Add Section Button -->
            <div class="no-print mt-8 flex justify-center">
                <button onclick="addNewSection()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700/60 hover:bg-indigo-50 dark:hover:bg-indigo-950/40 text-slate-700 dark:text-slate-200 hover:text-indigo-600 dark:hover:text-indigo-400 rounded-xl text-sm font-medium border border-dashed border-slate-300 dark:border-slate-600 hover:border-indigo-400 transition flex items-center gap-2 group">
                    <i class="fa-solid fa-plus-circle text-slate-400 group-hover:text-indigo-500"></i>
                    <span>새 성찰 섹션 추가하기</span>
                </button>
            </div>

            <!-- Summary Quote / Final Words -->
            <div class="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-xl p-5 border border-slate-200/80 dark:border-slate-700/60">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">
                    <i class="fa-solid fa-quote-left mr-1"></i> 나에게 남기는 한 줄 요약 메세지
                </label>
                <input id="finalSummaryQuote" type="text" 
                    value="시행착오는 성장의 밑거름이다. 더 나은 내일을 위해 지속적으로 도전하자!" 
                    placeholder="성찰을 마무리하며 자신에게 건네는 한 줄 메세지를 적으세요..." 
                    class="w-full bg-transparent text-slate-800 dark:text-slate-200 italic font-medium focus:outline-none border-b border-transparent focus:border-indigo-500 text-sm sm:text-base"
                    oninput="handleInput()">
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed bottom-6 right-6 no-print transform translate-y-20 opacity-0 transition-all duration-300 z-50 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMsg">성찰 내용이 저장되었습니다.</span>
    </div>

    <!-- Confirm Dialog Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
            <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">정말 초기화하시겠습니까?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">작성하신 모든 내용이 삭제되고 기본 템플릿으로 다시 로드됩니다.</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-700">취소</button>
                <button onclick="executeReset()" class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold hover:bg-red-700">초기화 진행</button>
            </div>
        </div>
    </div>

                        title: "3. Findings (교훈 및 발견)",
                        icon: "fa-magnifying-glass",
                        guide: "이 경험을 통해 새롭게 알게 된 사실이나 성장의 계기는 무엇인가요?",
                        content: "위기 상황일수록 팀원 간의 투명한 정보 공유가 신뢰를 유지하는 데 결정적이라는 것을 배움."
                    },
                    {
                        id: "sec_f4",
                        title: "4. Future (향후 적용)",
                        icon: "fa-compass",
                        guide: "앞으로 유사한 상황이 올 때 어떻게 행동할 것인가요?",
                        content: "다음 프로젝트에서는 초기 리스크 관리 리스트를 미리 작성하여 우발 상황에 선제 대응하겠다."
                    }
                ]
            }
        };

        // App Global State
        let state = {
            isViewMode: false,
            autoSaveTimer: null
        };

        // Initialize App on DOM Load
        window.onload = function() {
            // Set default date if empty
            const dateInput = document.getElementById('docDate');
            if (!dateInput.value) {
                dateInput.value = new Date().toISOString().split('T')[0];
            }

            // Load saved data or load default template
            if (!loadFromLocalStorage()) {
                applyTemplate('comprehensive', false);
            }

            calculateProgress();
        };

        // Local Storage Methods
        function saveToLocalStorage() {
            const data = extractFormData();
            localStorage.setItem('final_reflection_data', JSON.stringify(data));
            showSaveIndicator();
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('final_reflection_data');
            if (!saved) return false;

            try {
                const data = JSON.parse(saved);
                renderFormData(data);
                return true;
            } catch (e) {
                console.error("Failed to parse saved reflection data", e);
                return false;
            }
        }

        function extractFormData() {
            const sections = [];
            document.querySelectorAll('.reflection-section').forEach(sec => {
                sections.push({
                    id: sec.dataset.id,
                    title: sec.querySelector('.sec-title').value,
                    guide: sec.querySelector('.sec-guide') ? sec.querySelector('.sec-guide').innerText : '',
                    content: sec.querySelector('.sec-content').value
                });
            });

            return {
                title: document.getElementById('docTitle').value,
                author: document.getElementById('docAuthor').value,
                date: document.getElementById('docDate').value,
                category: document.getElementById('docCategory').value,
                tags: document.getElementById('docTags').value,
                quote: document.getElementById('finalSummaryQuote').value,
                sections: sections
            };
        }

        function renderFormData(data) {
            document.getElementById('docTitle').value = data.title || '';
            document.getElementById('docAuthor').value = data.author || '';
            document.getElementById('docDate').value = data.date || '';
            document.getElementById('docCategory').value = data.category || '';
            document.getElementById('docTags').value = data.tags || '';
            document.getElementById('finalSummaryQuote').value = data.quote || '';

            // Render Sections
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';
            if (data.sections && data.sections.length > 0) {
                data.sections.forEach(sec => {
                    container.appendChild(createSectionElement(sec.id, sec.title, sec.guide, sec.content));
                });
            }

            calculateProgress();
        }

        // Apply Preset Template
        function applyTemplate(type, triggerSave = true) {
            const tmpl = TEMPLATES[type] || TEMPLATES.comprehensive;
            renderFormData({
                title: tmpl.title,
                author: document.getElementById('docAuthor').value || "홍길동",
                date: document.getElementById('docDate').value || new Date().toISOString().split('T')[0],
                category: tmpl.category,
                tags: "회고, 성장, 학습",
                quote: tmpl.quote,
                sections: tmpl.sections
            });

            if (triggerSave) {
                saveToLocalStorage();
                showToast("템플릿이 적용되었습니다.");
            }
        }

        // Create Section Element DOM
        function createSectionElement(id, title, guide, content) {
            const div = document.createElement('div');
            div.className = 'reflection-section card-box bg-slate-50/60 dark:bg-slate-900/40 rounded-2xl p-5 sm:p-6 border border-slate-200/80 dark:border-slate-700/60 transition hover:border-indigo-200 dark:hover:border-slate-600 relative group';
            div.dataset.id = id || 'sec_' + Date.now();

            div.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <input type="text" value="${escapeHtml(title)}" 
                        placeholder="섹션 제목을 입력하세요" 
                        class="sec-title w-full font-bold text-base sm:text-lg text-slate-900 dark:text-white bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:outline-none py-0.5"
                        oninput="handleInput()">
                    <button onclick="removeSection(this)" class="no-print opacity-0 group-hover:opacity-100 transition text-slate-400 hover:text-red-500 p-1 text-sm ml-2" title="섹션 삭제">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
                <div class="relative mt-2">
                    <textarea 
                        class="sec-content w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3.5 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 min-h-[110px] resize-y"
                        placeholder="이 항목에 대한 생각과 성찰 내용을 입력하세요..."
                        oninput="autoExpandTextarea(this); handleInput()">${escapeHtml(content)}</textarea>
                    <div class="text-[11px] text-slate-400 text-right mt-1 font-mono no-print">
                        <span class="char-count">${content ? content.length : 0}</span>자
                    </div>
                </div>
            `;

            // Adjust height after DOM attach
            setTimeout(() => {
                const textarea = div.querySelector('textarea');
                if (textarea) autoExpandTextarea(textarea);
            }, 0);

            return div;
        }

        // Add / Remove Section
        function addNewSection() {
            const container = document.getElementById('sectionsContainer');
            const id = 'sec_' + Date.now();
            const newSec = createSectionElement(id, '새로운 성찰 항목', '자유롭게 성찰하고 싶은 내용을 기술해보세요.', '');
            container.appendChild(newSec);
            newSec.querySelector('input').focus();
            handleInput();
        }

        function removeSection(btn) {
            const sec = btn.closest('.reflection-section');
            if (sec) {
                sec.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    sec.remove();
                    handleInput();
                }, 200);
            }
        }

        // Action Items (Checklist)
        function createActionItemElement(text = '', done = false) {
            const div = document.createElement('div');
            div.className = 'action-item flex items-center justify-between gap-3 bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700/80 group transition';
            div.innerHTML = `
                <div class="flex items-center gap-3 w-full">
                    <input type="checkbox" ${done ? 'checked' : ''} 
                        class="action-checkbox w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                        onchange="handleInput()">
                    <input type="text" value="${escapeHtml(text)}" 
                        placeholder="실천할 목표나 구체적 액션을 입력하세요" 
                        class="action-text w-full text-sm bg-transparent border-b border-transparent hover:border-slate-200 focus:border-indigo-500 focus:outline-none text-slate-800 dark:text-slate-200 ${done ? 'line-through text-slate-400' : ''}"
                        oninput="handleInput()">
                </div>
                <button onclick="removeActionItem(this)" class="no-print opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-500 p-1 text-xs transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;

            const checkbox = div.querySelector('.action-checkbox');
            const textInput = div.querySelector('.action-text');
            checkbox.addEventListener('change', () => {
                if (checkbox.checked) {
                    textInput.classList.add('line-through', 'text-slate-400');
                } else {
                    textInput.classList.remove('line-through', 'text-slate-400');
                }
            });

            return div;
        }

        function addActionItem() {
            const list = document.getElementById('actionItemsList');
            const newItem = createActionItemElement('', false);
            list.appendChild(newItem);
            newItem.querySelector('.action-text').focus();
            handleInput();
        }

        function removeActionItem(btn) {
            const item = btn.closest('.action-item');
            if (item) {
                item.remove();
                handleInput();
            }
        }

        // Rating Star Handler
        function setRating(val) {
            state.rating = val;
            updateRatingDisplay(val);
            handleInput();
        }

        function updateRatingDisplay(val) {
            const stars = document.querySelectorAll('#starContainer i');
            const ratingTexts = ["(미평가)", "1점 (아쉬움)", "2점 (보통)", "3점 (만족)", "4점 (우수)", "5점 (매우 우수)"];

            stars.forEach((star, idx) => {
                if (idx < val) {
                    star.className = 'fa-solid fa-star text-amber-400 scale-105';
                } else {
                    star.className = 'fa-regular fa-star text-slate-300 dark:text-slate-600';
                }
            });

            document.getElementById('ratingValueText').innerText = ratingTexts[val] || "(미평가)";
        }

        // Input Handler with Debounced Auto-Save
        function handleInput() {
            // Update character counters
            document.querySelectorAll('.reflection-section').forEach(sec => {
                const txt = sec.querySelector('textarea').value;
                const counter = sec.querySelector('.char-count');
                if (counter) counter.innerText = txt.length;
            });

            calculateProgress();

            // Debounced autosave
            clearTimeout(state.autoSaveTimer);
            state.autoSaveTimer = setTimeout(() => {
                saveToLocalStorage();
            }, 600);
        }

        function autoExpandTextarea(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight + 2) + 'px';
        }

        // Calculate Completion Progress
        function calculateProgress() {
            const sections = document.querySelectorAll('.sec-content');
            let filled = 0;
            sections.forEach(s => {
                if (s.value.trim().length > 10) filled++;
            });

            const total = sections.length || 1;
            const pct = Math.min(100, Math.round((filled / total) * 100));
            document.getElementById('progressBar').style.width = pct + '%';
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        // Read/Edit Mode Toggle
        function toggleViewMode() {
            state.isViewMode = !state.isViewMode;
            const docRoot = document.getElementById('printableArea');
            const btn = document.getElementById('viewModeBtn');

            if (state.isViewMode) {
                document.querySelectorAll('.no-print').forEach(el => el.classList.add('hidden'));
                docRoot.classList.add('ring-2', 'ring-indigo-500/20');
                btn.innerHTML = `<i class="fa-solid fa-pen"></i><span class="hidden sm:inline">편집 모드</span>`;
                btn.classList.add('bg-indigo-50', 'text-indigo-600', 'dark:bg-indigo-950/50');
                showToast("미리보기 모드로 전환되었습니다.");
            } else {
                document.querySelectorAll('.no-print').forEach(el => el.classList.remove('hidden'));
                docRoot.classList.remove('ring-2', 'ring-indigo-500/20');
                btn.innerHTML = `<i class="fa-solid fa-eye"></i><span class="hidden sm:inline">미리보기</span>`;
                btn.classList.remove('bg-indigo-50', 'text-indigo-600', 'dark:bg-indigo-950/50');
            }
        }

        // Export Dropdown Toggle
        function toggleExportMenu() {
            const menu = document.getElementById('exportMenu');
            menu.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
            const btn = document.getElementById('exportDropdownBtn');
            const menu = document.getElementById('exportMenu');
            if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        // Export Options
        function exportToPDF() {
            document.getElementById('exportMenu').classList.add('hidden');
            showToast("PDF 생성 준비 중...");
            
            const element = document.getElementById('printableArea');
            const title = document.getElementById('docTitle').value || '성찰일지';
            
            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     `${title.replace(/[^a-zA-Z0-9가-힣]/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            if (window.html2pdf) {
                html2pdf().set(opt).from(element).save().then(() => {
                    showToast("PDF 다운로드가 완료되었습니다.");
                });
            } else {
                window.print();
            }
        }

        function exportToMarkdown() {
            document.getElementById('exportMenu').classList.add('hidden');
            const data = extractFormData();
            
            let md = `# ${data.title}\n\n`;
            md += `- **작성자**: ${data.author}\n`;
            md += `- **작성일**: ${data.date}\n`;
            md += `- **카테고리**: ${data.category}\n`;
            md += `- **태그**: ${data.tags}\n\n`;
            md += `---\n\n`;

            data.sections.forEach(sec => {
                md += `## ${sec.title}\n\n`;
                if (sec.guide) md += `> *${sec.guide}*\n\n`;
                md += `${sec.content}\n\n`;
            });

            if (data.quote) {
                md += `> **한 줄 정리**: "${data.quote}"\n`;
            }

            downloadFile(md, `${data.title.replace(/[^a-zA-Z0-9가-힣]/g, '_')}.md`, 'text/markdown');
            showToast("마크다운 파일이 다운로드되었습니다.");
        }

        function exportToJSON() {
            document.getElementById('exportMenu').classList.add('hidden');
            const data = extractFormData();
            const jsonStr = JSON.stringify(data, null, 2);
            downloadFile(jsonStr, `reflection_backup_${data.date}.json`, 'application/json');
            showToast("백업 파일이 생성되었습니다.");
        }

        function importFromJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    renderFormData(data);
                    saveToLocalStorage();
                    showToast("성공적으로 불러왔습니다.");
                } catch (err) {
                    showToast("올바르지 않은 JSON 파일입니다.", "error");
                }
            };
            reader.readAsText(file);
        }

        function downloadFile(content, fileName, contentType) {
            const a = document.createElement('a');
            const file = new Blob([content], { type: contentType });
            a.href = URL.createObjectURL(file);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // Modal Helpers
        function confirmReset() {
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('confirmModal').classList.add('hidden');
        }

        function executeReset() {
            closeModal();
            localStorage.removeItem('final_reflection_data');
            applyTemplate('comprehensive', false);
            showToast("초기화가 완료되었습니다.");
        }

        // UI Toast Helper
        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.innerText = msg;
            if (type === "error") {
                toastIcon.className = "fa-solid fa-circle-exclamation text-red-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function showSaveIndicator() {
            const status = document.getElementById('saveStatus');
            status.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500 text-[10px]"></i> 자동 저장됨 (${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
